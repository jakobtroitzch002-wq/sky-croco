name: Build Crocodilandy Sky

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
        distribution: 'temurin'
          java-version: "25"

      - name: Gradle vorbereiten
        uses: gradle/actions/setup-gradle@v4

      - name: Mod bauen
        run: gradle build --no-daemon

      - name: Fertige Mod speichern
        uses: actions/upload-artifact@v4
        with:
          name: Crocodilandy-Sky-Mod
          path: build/libs/*.jar
          retention-days: 30
